name: Deploy Angular app to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: |
          BASE_HREF="/${GITHUB_REPOSITORY#*/}/"
          if [ "${GITHUB_REPOSITORY,,}" = "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then
            BASE_HREF="/"
          fi
          npm run build -- --base-href="$BASE_HREF"

      - name: Add GitHub Pages fallback for Angular routes
        run: cp dist/movieapp/browser/index.html dist/movieapp/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/movieapp/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
